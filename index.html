<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"> </canvas>

    <p id="score">Score: 0</p>

    <div id="gameControls">
    <button id="startBtn">START</button>
    <button id="pauseBtn">PAUSE</button>
    <button id="restartBtn">RESTART</button>
    </div>

    <p id="info">READY!</p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let gameState = "ready";

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "lime";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)


        // Move the snake forward
        const moveSnake = () => {
            // Create a new head based on the current direction
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Add the new head to the snake
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                
                // increase and update the score
                score ++;
                document.getElementById("score").textContent = "Score: " + score;

                // Keep the tail to make the snake grow
                createFood();

            } else {

                // Remove the last segment to keep the same length
                snake.pop();

            }
        };
        
        // Game loop
        const gameLoop = () => {

            if (gameState !== "playing") {
                return;
            }


            // Move the snake
            moveSnake();

            // Check for collision
            if (checkCollision()) {

                // Stop the game
                clearInterval(gameInterval);
                gameInterval = null;

                gameState = "gameover";

                // Show game over message
                document.getElementById("info").textContent =
                    "Game Over!";

                return;
            }

            // Redraw the game
            drawGame();
        };

        
        let gameInterval = null;


        // Step 2: Keyboard controls (arrow keys)


        document.addEventListener("keydown", (event) => {
            
            // Move up
            if (event.key === "ArrowUp" && direction.y !== 1) {
                direction = { x: 0, y: -1 };
            }

            // Move down
            if (event.key === "ArrowDown" && direction.y !== -1) {
                direction = { x: 0, y: 1 };
            }

            // Move left
            if (event.key === "ArrowLeft" && direction.x !== 1) {
                direction = { x: -1, y: 0 };
            }

            // Move right
            if (event.key === "ArrowRight" && direction.x !== -1) {
                direction = { x: 1, y: 0 };
            }

        });


        // Step 3: Eating and growing


        // Create a new food item at a random position
        const createFood = () => {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        };


        // Step 4: Game over


        // Check for collisions with walls or the snake's body
        const checkCollision = () => {

            const head = snake[0];

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount){
                return true;
            }

            // Check collision with the snake's body
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }

            // No collision
            return false;
        };


        // Step 5: Improvements

        // START BUTTON
        document.getElementById("startBtn").addEventListener("click", () => {

            if (gameState === "ready" || gameState === "paused") {

                gameState = "playing";

                document.getElementById("info").textContent = "";

                gameInterval = setInterval(gameLoop, 150);
            }

        });


        // PAUSE BUTTON
        document.getElementById("pauseBtn").addEventListener("click", () => {

            if (gameState === "playing") {

                gameState = "paused";

                clearInterval(gameInterval);
                gameInterval = null;

                document.getElementById("info").textContent = "PAUSED";
            }

        });


        // RESTART BUTTON
        document.getElementById("restartBtn").addEventListener("click", () => {

            clearInterval(gameInterval);

            gameInterval = null;

            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];

            direction = { x: 1, y: 0 };

            food = { x: 15, y: 15 };

            score = 0;

            gameState = "ready";

            document.getElementById("score").textContent = "Score: 0";
            document.getElementById("info").textContent = "READY!";

            drawGame();

        });    


        //  
        // ===================================

    </script>

</body>
</html>
